integrations:
  - name: nri-flex
    interval: 60s
    env:
      # Uncomment these variables and set to remove all infrastructure agent
      # metadata appended to data within NRDB.
      # INSIGHTS_API_KEY: <ingest_key>
      # INSIGHTS_URL: https://insights-collector.newrelic.com/v1/accounts/<account_id>/events
      EVENT_LIMIT: 100000
    config:
      name: gcp-gemini-enterprise-flex
      variable_store:
        service_account_email: YOUR_SERVICE_ACCOUNT_EMAIL # Required
        service_account_key: PATH_TO_YOUR_SERVICE_ACCOUNT_KEY # Required
        project_id: YOUR_PROJECT_ID # Required
      apis:
        #
        # Initial authentication of service account using the gcloud CLI.
        # Uncomment this section and run nri-flex manually for the first time
        # ONLY. Then comment this section out and leave it commented out.
        #
        # - name: gcp-auth
        #   ignore_output: true
        #   commands:
        #     - run: gcloud auth activate-service-account ${var:service_account_email} --key-file=${var:service_account_key}

        #
        # Get the access token for the service account using the gcloud CLI.
        #
        - name: get-access-token
          ignore_output: true
          commands:
            - run: gcloud auth print-access-token --format json
          store_variables:
            access_token: token

        #
        # Get the API request count for the discovery engine API.
        # Metric kind, type, unit: DELTA, INT64, 1
        #
        - name: serviceruntime-api-request-count
          event_type: GeminiEnterpriseSample
          url: https://monitoring.googleapis.com/v3/projects/${var:project_id}/timeSeries?interval.startTime=${timestamp:datetimeutctz-360s}&interval.endTime=${timestamp:datetimeutctz-300s}&filter=metric.type="serviceruntime.googleapis.com/api/request_count"%20AND%20resource.labels.service="discoveryengine.googleapis.com"
          headers:
            Authorization: Bearer ${var:access_token}
          start_key:
          - timeSeries>points
          inherit_attributes: true
          timestamp_conversion:
            interval.startTime: TIMESTAMP::RFC3339
            interval.endTime: TIMESTAMP::RFC3339
          rename_keys:
            parent.0.metric.type: metricType
            parent.0.resource.type: resourceType
            parent.0.resource.labels.location: resourceLocation
            parent.0.resource.labels.method: resourceMethod
            parent.0.resource.labels.project_id: projectId
            parent.0.resource.labels.service: resourceService
            parent.0.resource.labels.version: resourceVersion
            value.int64Value: value
          sample_include_filter:
          - metricType: serviceruntime.googleapis.com/api/request_count
          add_attribute:
            timestamp: ${interval.endTime}
          remove_keys:
            - parent.0.metric.labels.grpc_status_code
            - parent.0.metric.labels.response_code_class
            - parent.0.metric.labels.response_code
            - parent.0.metric.labels.protocol
            - parent.0.resource.labels.credential_id
            - parent.0.api.StatusCode
            - parent.0.metricKind
            - parent.0.valueType
            - parent.0.unit

        #
        # Get the regional number of discovery engine data stores
        # Metric kind, type, unit: GAUGE, INT64, 1
        #
        - name: discovery-engine-data-stores-regional
          event_type: GeminiEnterpriseSample
          url: https://monitoring.googleapis.com/v3/projects/${var:project_id}/timeSeries?interval.startTime=${timestamp:datetimeutctz-180s}&interval.endTime=${timestamp:datetimeutctz-120s}&filter=metric.type="discoveryengine.googleapis.com/data_stores_regional"
          headers:
            Authorization: Bearer ${var:access_token}
          start_key:
          - timeSeries>points
          inherit_attributes: true
          timestamp_conversion:
            interval.startTime: TIMESTAMP::RFC3339
            interval.endTime: TIMESTAMP::RFC3339
          rename_keys:
            parent.0.metric.type: metricType
            parent.0.metric.labels.regional_location: regionalLocation
            parent.0.resource.type: resourceType
            parent.0.resource.labels.location: resourceLocation
            parent.0.resource.labels.project_id: projectId
            value.int64Value: value
          sample_include_filter:
          - metricType: discoveryengine.googleapis.com/data_stores_regional
          add_attribute:
            timestamp: ${interval.endTime}
          remove_keys:
            - parent.0.api.StatusCode
            - parent.0.metricKind
            - parent.0.valueType
            - parent.0.unit

        #
        # Get the regional number of discovery engine engines
        # Metric kind, type, unit: GAUGE, INT64, 1
        #
        - name: discovery-engine-engines-regional
          event_type: GeminiEnterpriseSample
